<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker | Roz Alrubaysh</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #171717;
      min-height: 100vh;
      padding: 30px 18px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      text-decoration: none;
      color: #555;
      font-weight: 600;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
      margin-bottom: 20px;
    }

    .balance-label {
      color: #777;
      font-size: 14px;
    }

    .balance {
      font-size: 36px;
      font-weight: bold;
      margin-top: 6px;
    }

    form {
      display: grid;
      gap: 12px;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #ddd;
      background: white;
    }

    button {
      border: none;
      background: #171717;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .expense {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .expense:last-child {
      border-bottom: none;
    }

    .expense-name {
      font-weight: bold;
    }

    .category {
      font-size: 13px;
      color: #777;
      margin-top: 4px;
    }

    .amount {
      font-weight: bold;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 20px 0;
    }

    .clear {
      background: transparent;
      color: #777;
      border: 1px solid #ddd;
      margin-top: 15px;
    }

    .project-note {
      font-size: 13px;
      color: #888;
      text-align: center;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<div class="container">

  <a class="back" href="../../index.html">← Back to Portfolio</a>

  <h1>Personal Expense Tracker</h1>

  <p class="subtitle">
    A simple web project I built to practice working with user input,
    JavaScript, and browser storage while solving an everyday problem.
  </p>

  <div class="card">
    <div class="balance-label">TOTAL EXPENSES</div>
    <div class="balance" id="total">SAR 0.00</div>
  </div>

  <div class="card">

    <form id="expenseForm">

      <input
        id="name"
        type="text"
        placeholder="Expense name"
        required
      >

      <input
        id="amount"
        type="number"
        min="0"
        step="0.01"
        placeholder="Amount (SAR)"
        required
      >

      <select id="category">
        <option>Food</option>
        <option>Transport</option>
        <option>Shopping</option>
        <option>Entertainment</option>
        <option>Education</option>
        <option>Other</option>
      </select>

      <button type="submit">Add Expense</button>

    </form>

  </div>

  <div class="card">

    <h2>Recent Expenses</h2>

    <div id="expenseList"></div>

    <button class="clear" onclick="clearExpenses()">
      Clear All
    </button>

  </div>

  <div class="project-note">
    Built with HTML, CSS & JavaScript · Data is stored locally in your browser
  </div>

</div>

<script>

let expenses =
  JSON.parse(localStorage.getItem("rozExpenses")) || [];

const form = document.getElementById("expenseForm");
const list = document.getElementById("expenseList");
const total = document.getElementById("total");

function renderExpenses() {

  list.innerHTML = "";

  if (expenses.length === 0) {
    list.innerHTML =
      '<div class="empty">No expenses yet. Add your first one above.</div>';
  }

  let sum = 0;

  expenses.forEach(function(expense) {

    sum += Number(expense.amount);

    const item = document.createElement("div");
    item.className = "expense";

    item.innerHTML = `
      <div>
        <div class="expense-name">${expense.name}</div>
        <div class="category">${expense.category}</div>
      </div>

      <div class="amount">
        SAR ${Number(expense.amount).toFixed(2)}
      </div>
    `;

    list.appendChild(item);
  });

  total.textContent = "SAR " + sum.toFixed(2);

  localStorage.setItem(
    "rozExpenses",
    JSON.stringify(expenses)
  );
}

form.addEventListener("submit", function(event) {

  event.preventDefault();

  const name =
    document.getElementById("name").value.trim();

  const amount =
    document.getElementById("amount").value;

  const category =
    document.getElementById("category").value;

  expenses.unshift({
    name: name,
    amount: amount,
    category: category
  });

  form.reset();

  renderExpenses();
});

function clearExpenses() {

  expenses = [];

  localStorage.removeItem("rozExpenses");

  renderExpenses();
}

renderExpenses();

</script>

</body>
</html>
